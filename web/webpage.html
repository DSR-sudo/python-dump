<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏地图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; overflow: hidden; height: 100vh; width: 100vw; }
        #top-controls { position: fixed; top: 0; left: 0; right: 0; background-color: #333; padding: 10px; z-index: 100; display: flex; flex-wrap: wrap; gap: 5px; max-height: 50%; overflow-y: auto; }
        .button-group { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; }
        .map-btn, .player-btn, .control-btn { flex: 1; min-width: 70px; padding: 8px; background-color: #555; color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .map-btn.active, .player-btn.active { background-color: #4CAF50; }
        #map-container { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; overflow: hidden; background-color: #222; }
        #map { position: absolute; background-repeat: no-repeat; background-size: 100% 100%; transform-origin: 0 0; }
        .entity-container { position: absolute; transform: translate(-50%, -50%); z-index: 10; }
        .entity-body { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 1px solid white; display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: bold; color: white; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .entity-direction { position: absolute; width: 1.5px; height: 12px; background-color: white; left: 50%; bottom: 50%; transform-origin: center bottom; }
        .entity-body.dead { width: 10px; height: 10px; background-color: transparent !important; border-width: 1.5px; }
        .entity-health-ring { position: absolute; width: 22px; height: 22px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); background: conic-gradient(var(--health-color) calc(var(--health-ratio) * 1turn), rgba(255,255,255,0.18) 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0); pointer-events: none; }
        .entity-info { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: #fff; text-shadow: 0 1px 2px #000; font-size: 9px; line-height: 11px; pointer-events: none; }
        .item-body { width: 10px; height: 10px; border-radius: 2px; border: 1px solid #222; background-color: #ffeb3b; color: #111; font-size: 7px; }
        .item-info { top: 12px; font-size: 8px; color: #ffeb3b; }
        .teammate { background-color: green; }
        .white-player { background-color: white; border-color: black; color: black; }
        #reset-view { background-color: #f44336; }
        #reset-view:active { background-color: #d32f2f; }
        #auth-container { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        #auth-input { padding: 6px; border: none; border-radius: 4px; width: 120px; }
        #auth-submit { padding: 6px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #auth-error { color: red; font-size: 12px; margin-top: 5px; display: none; }
        #auth-container.hidden { display: none; }
        #bottom-controls { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; gap: 8px; }
        #resource-toggle, #clean-toggle { min-width: 52px; min-height: 36px; padding: 8px 10px; background-color: #555; color: white; border: 1px solid #777; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        #resource-toggle.active { background-color: #4CAF50; border-color: #6fcf73; }
        #clean-toggle.active { background-color: #2196F3; border-color: #64b5f6; }
        #resource-toggle:disabled { opacity: 0.45; cursor: default; }
        #quality-filter.disabled { opacity: 0.45; pointer-events: none; }
        #quality-filter { position: fixed; top: 80px; right: 12px; z-index: 210; display: grid; gap: 5px; min-width: 104px; padding: 8px; background: rgba(35, 35, 35, 0.94); border: 1px solid #555; border-radius: 4px; font-size: 11px; }
        #quality-filter-title { color: #bbb; font-weight: bold; margin-bottom: 2px; }
        .quality-option { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .quality-option input { margin: 0; }
        .quality-swatch { width: 9px; height: 9px; border: 1px solid #222; display: inline-block; }
        #calibrate-toggle { min-width: 52px; min-height: 36px; padding: 8px 10px; background-color: #555; color: white; border: 1px solid #777; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        #calibrate-toggle.active { background-color: #ff9800; border-color: #ffb74d; }
        #calibrate-panel { position: fixed; left: 12px; right: 96px; bottom: 60px; z-index: 220; display: none; max-width: min(560px, calc(100vw - 24px)); padding: 8px; background: rgba(35, 35, 35, 0.96); border: 1px solid #555; border-radius: 4px; font-size: 11px; color: #ddd; }
        #calibrate-panel.open { display: block; }
        .cal-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 5px; }
        .cal-tag { color: #bbb; font-weight: bold; }
        .cal-btn { padding: 4px 8px; background-color: #555; color: white; border: 1px solid #777; border-radius: 3px; font-size: 11px; cursor: pointer; }
        .cal-btn.active { background-color: #ff9800; border-color: #ffb74d; }
        #calibrate-panel input { width: 68px; padding: 3px 4px; background: #111; color: #eee; border: 1px solid #555; border-radius: 3px; font-size: 11px; }
        #cal-code { width: 100%; height: 74px; margin-top: 2px; padding: 4px; background: #111; color: #9cff9c; border: 1px solid #555; border-radius: 3px; font-family: monospace; font-size: 10px; resize: vertical; }
        .calibrate-marker { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #ff5252; border-radius: 50%; color: #fff; font-size: 10px; line-height: 18px; text-align: center; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 30; }
        .entity-container.calibrate-entity .entity-body { outline: 2px solid #40c4ff; outline-offset: 3px; }
        #cal-entity { color: #9cdcff; }
    </style>
</head>
<body>
    <div id="top-controls">
        <div class="button-group">
            <div id="map-buttons"></div>
        </div>
        <div class="button-group">
            <div id="player-buttons"></div>
        </div>
        <div id="auth-container">
            <input type="text" id="auth-input" placeholder="输入密码" autocomplete="off">
            <button id="auth-submit">确认</button>
            <div id="auth-error">密码错误，请重试</div>
        </div>
        <div id="calibration-status" style="width: 100%; text-align: center; padding: 2px; font-weight: bold; min-height: 1em;display:none"></div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>
    <div id="quality-filter" aria-label="Item quality filter">
        <div id="quality-filter-title">Item Quality</div>
        <label class="quality-option"><input type="checkbox" data-quality="0" checked><span class="quality-swatch" style="background:#c8c8c8"></span>None</label>
        <label class="quality-option"><input type="checkbox" data-quality="1" checked><span class="quality-swatch" style="background:#f7f7f7"></span>White</label>
        <label class="quality-option"><input type="checkbox" data-quality="2" checked><span class="quality-swatch" style="background:#14d914"></span>Green</label>
        <label class="quality-option"><input type="checkbox" data-quality="3" checked><span class="quality-swatch" style="background:#4876ff"></span>Blue</label>
        <label class="quality-option"><input type="checkbox" data-quality="4" checked><span class="quality-swatch" style="background:#e066ff"></span>Purple</label>
        <label class="quality-option"><input type="checkbox" data-quality="5" checked><span class="quality-swatch" style="background:#ffff00"></span>Gold</label>
        <label class="quality-option"><input type="checkbox" data-quality="6" checked><span class="quality-swatch" style="background:#ff3030"></span>Red</label>
    </div>
    <div id="bottom-controls">
        <button id="resource-toggle" class="active" type="button" aria-pressed="true">资源</button>
        <button id="clean-toggle" type="button" aria-pressed="false" title="只显示玩家，隐藏物资与AI">纯净模式</button>
        <button id="calibrate-toggle" type="button" aria-pressed="false" title="点地图取点，微调当前地图的校准">校准</button>
    </div>
    <div id="calibrate-panel">
        <div class="cal-row">
            <span id="cal-hint">点地图取点的图上坐标</span>
            <button id="cal-pick-1" class="cal-btn" type="button">取点1</button>
            <button id="cal-pick-2" class="cal-btn" type="button">取点2</button>
            <button id="cal-copy" class="cal-btn" type="button">复制代码</button>
            <button id="cal-revert" class="cal-btn" type="button">还原</button>
            <button id="cal-close" class="cal-btn" type="button">关闭</button>
        </div>
        <div class="cal-row">
            <span class="cal-tag">选中</span><span id="cal-entity">无 — 校准模式下点地图上的角色/物资即可选中</span>
        </div>
        <div class="cal-row">
            <span class="cal-tag">点1</span>世界
            <input id="cal-w1x" type="number" step="1"><input id="cal-w1y" type="number" step="1">
            图上<input id="cal-m1x" type="number" step="0.01"><input id="cal-m1y" type="number" step="0.01">
            <button id="cal-here-1" class="cal-btn" type="button">用当前位置</button>
            <button id="cal-ent-1" class="cal-btn" type="button">用选中实体</button>
        </div>
        <div class="cal-row">
            <span class="cal-tag">点2</span>世界
            <input id="cal-w2x" type="number" step="1"><input id="cal-w2y" type="number" step="1">
            图上<input id="cal-m2x" type="number" step="0.01"><input id="cal-m2y" type="number" step="0.01">
            <button id="cal-here-2" class="cal-btn" type="button">用当前位置</button>
            <button id="cal-ent-2" class="cal-btn" type="button">用选中实体</button>
        </div>
        <textarea id="cal-code" readonly spellcheck="false"></textarea>
    </div>
    <script>
    const mapDimensions = {
        "db.png":  { width: 1244, height: 956 },
        "cg.png":  { width: 1333, height: 936 },
        "bks.png": { width: 833, height: 950 },
        "ht.png":  { width: 921, height: 989 },
        "jy.png":  { width: 1013, height: 1009 },
        "az3.png": { width: 2048, height: 2048 }
    };

    const mapConverters = {
        "db.png": {
            point3D_1: { x: -16207, y: -27879 },
            point2D_1: { x: 470, y: 245 },
            point3D_2: { x: 35455, y: 37782  },
            point2D_2: { x: 1025, y: 946 }
        },
        "cg.png": {
            point3D_1: { x: -32065, y: 58724 },
            point2D_1: { x: 176, y: 816 },
            point3D_2: { x: -102202, y: -22623  },
            point2D_2: { x: 863, y: 228 }
        },
        "bks.png": {
            point3D_1: { x: -14036, y: 9953 },
            point2D_1: { x: 182, y: 696 },
            point3D_2: { x: 14128, y: -34523  },
            point2D_2: { x: 588, y: 57 }
        },
        "ht.png": {
            point3D_1: { x: -27015, y: -18887 },
            point2D_1: { x: 104, y: 180 },
            point3D_2: { x: 17252, y: 27568  },
            point2D_2: { x: 686, y: 789 }
        },
        // AZ3（阿萨拉赛季）：实标两点。世界坐标量级与其他图一致（±数万），
        // 与官方地图页 getMapPos 用的那套坐标（±数十万）不同源，不能混用。
        "az3.png": {
            point3D_1: { x: 29596, y: 30011 },
            point2D_1: { x: 1473.03, y: 452.71 },
            point3D_2: { x: -37994, y: -42155 },
            point2D_2: { x: 563.5, y: 1307.71 }
        },
    };

    const transformerCache = {};

    function checkCalibration(mapName) {
        const statusEl = document.getElementById('calibration-status');
        if (!statusEl) return;
        const converter = mapConverters[mapName];
        if (!converter) { statusEl.innerHTML = ''; return; }
        const isPoint2Set = converter.point3D_2 && (converter.point3D_2.x !== 0 || converter.point3D_2.y !== 0);
        if (!isPoint2Set) {
            statusEl.style.color = 'orange';
            statusEl.textContent = '校准模式: 请微调Point 1';
            return;
        }
        const worldVecX = converter.point3D_2.x - converter.point3D_1.x, worldVecY = converter.point3D_2.y - converter.point3D_1.y;
        const mapVecX = converter.point2D_2.x - converter.point2D_1.x, mapVecY = converter.point2D_2.y - converter.point2D_1.y;
        const determinant = worldVecX * mapVecY - worldVecY * mapVecX;
        if (determinant < 0) {
            statusEl.style.color = 'red';
            statusEl.textContent = '警告: 校准点位可能为镜像(反向)!';
        } else {
            statusEl.style.color = '#4CAF50';
            statusEl.textContent = '校准成功';
        }
    }

    function createCoordinateTransformer(converter) {
        const p1_3d = converter.point3D_1, p2_3d = converter.point3D_2, p1_2d = converter.point2D_1, p2_2d = converter.point2D_2;
        const worldVecX = p2_3d.x - p1_3d.x, worldVecY = p2_3d.y - p1_3d.y, mapVecX = p2_2d.x - p1_2d.x, mapVecY = p2_2d.y - p1_2d.y;
        const worldDist = Math.hypot(worldVecX, worldVecY), mapDist = Math.hypot(mapVecX, mapVecY);
        const scale = (worldDist === 0) ? 1 : mapDist / worldDist;
        const worldAngle = Math.atan2(worldVecY, worldVecX), mapAngle = Math.atan2(mapVecY, mapVecX);
        const rotation = mapAngle - worldAngle, cosRotation = Math.cos(rotation), sinRotation = Math.sin(rotation);
        const orientationCorrection = rotation * (180 / Math.PI);
        return function transform(position3D, orientation) {
            const deltaWorldX = position3D.x - p1_3d.x, deltaWorldY = position3D.y - p1_3d.y;
            const rotatedDeltaX = deltaWorldX * cosRotation - deltaWorldY * sinRotation;
            const rotatedDeltaY = deltaWorldX * sinRotation + deltaWorldY * cosRotation;
            const finalMapX = p1_2d.x + rotatedDeltaX * scale, finalMapY = p1_2d.y + rotatedDeltaY * scale;
            const finalRotation = (orientation || 0) + orientationCorrection + 90;
            return { position: { x: finalMapX, y: finalMapY }, rotation: finalRotation };
        };
    }

    function getTransformedData(entityData, mapName) {
        if (!entityData || !entityData.position) return { position: { x: 0, y: 0 }, rotation: 90 };
        const converter = mapConverters[mapName];
        if (!converter) return { position: { x: 0, y: 0 }, rotation: 90 };
        const isPoint2Set = converter.point3D_2 && (converter.point3D_2.x !== 0 || converter.point3D_2.y !== 0);
        if (!isPoint2Set) {
            return { position: converter.point2D_1, rotation: (entityData.orientation || 0) + 90 };
        }
        if (!transformerCache[mapName]) {
            transformerCache[mapName] = createCoordinateTransformer(converter);
        }
        return transformerCache[mapName](entityData.position, entityData.orientation);
    }

    function getTeamColor(team_id) { const colors = [ 'rgba(80, 80, 255, 1)', 'rgba(255, 160, 80, 1)', 'rgba(180, 80, 255, 1)', 'rgba(160, 100, 60, 1)', 'rgba(255, 220, 80, 1)', 'rgba(80, 220, 220, 1)', 'rgba(180, 80, 80, 1)', 'rgba(120, 80, 180, 1)', 'rgba(220, 120, 80, 1)', 'rgba(255, 160, 160, 1)', 'rgba(160, 160, 255, 1)', 'rgba(255, 200, 160, 1)', 'rgba(200, 160, 255, 1)', 'rgba(200, 150, 100, 1)', 'rgba(255, 240, 160, 1)', 'rgba(160, 240, 240, 1)', 'rgba(240, 160, 160, 1)', 'rgba(200, 160, 200, 1)', 'rgba(240, 200, 160, 1)', ]; return colors[team_id] || 'rgba(128, 128, 128, 1)'; }
    function readableCatalogName(value, fallback) {
        const text = String(value || '');
        if (!text) return fallback;
        return text.replace(/\(\d+\)$/, '');
    }

    let currentMap = 'db.png', scale = 1, offsetX = 0, offsetY = 0, isDragging = false, lastX = 0, lastY = 0, selectedPlayerId = null, teammates = [], localPlayer = null, pendingPlayerSelection = null, isFollowing = true, touchStartDistance = 0, touchStartScale = 1, resourcesVisible = true, resourcesVisibleBeforeClean = true, cleanMode = false;
    var entitiesToRender = [];
    var itemsToRender = [];
    const selectedItemQualities = new Set([0, 1, 2, 3, 4, 5, 6]);
    const DATA_POLL_INTERVAL_MS = 16;      // 60Hz 拉取：约 16.7ms 一帧
    const DATA_REFRESH_FALLBACK_MS = 2000; // 超过该时长没有新数据就强制重建一次，避免一直吃缓存
    const mapContainer = document.getElementById('map-container'), map = document.getElementById('map');

    function applyMapTransform() { map.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`; }

    window.addEventListener('resize', () => { if (isFollowing) recenterView(); });

    mapContainer.addEventListener('mousedown', (e) => { isDragging = true; isFollowing = false; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); });
    mapContainer.addEventListener('mousemove', (e) => { if (isDragging) { offsetX += e.clientX - lastX; offsetY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; applyMapTransform(); } });
    mapContainer.addEventListener('mouseup', () => isDragging = false);
    mapContainer.addEventListener('mouseleave', () => isDragging = false);

    // ===============================================================
    // == 修改点 1: 重写鼠标滚轮缩放逻辑 ==
    // ===============================================================
    mapContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        isFollowing = false;

        const rect = mapContainer.getBoundingClientRect();
        // 我们不再以鼠标位置为中心，而是以视图容器的中心为中心
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // 计算当前在视图中心点的地图坐标
        const mapCenterX = (centerX - offsetX) / scale;
        const mapCenterY = (centerY - offsetY) / scale;

        // 计算新的缩放比例
        const scaleFactor = 1.1;
        const newScale = e.deltaY < 0 ? scale * scaleFactor : scale / scaleFactor;
        scale = Math.min(Math.max(0.2, newScale), 5);

        // 重新计算 offsetX 和 offsetY，以保持地图中心点不变
        offsetX = centerX - mapCenterX * scale;
        offsetY = centerY - mapCenterY * scale;

        applyMapTransform();
    });

    mapContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isFollowing = false;
        if (e.touches.length === 1) {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            isDragging = false;
            const t1 = e.touches[0], t2 = e.touches[1];
            touchStartDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            touchStartScale = scale;
        }
    });

    // ===============================================================
    // == 修改点 2: 重写触摸移动（双指缩放）逻辑 ==
    // ===============================================================
    mapContainer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
            const touch = e.touches[0];
            offsetX += touch.clientX - lastX;
            offsetY += touch.clientY - lastY;
            lastX = touch.clientX;
            lastY = touch.clientY;
            applyMapTransform();
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];

            // 计算双指中心点
            const midX = (t1.clientX + t2.clientX) / 2;
            const midY = (t1.clientY + t2.clientY) / 2;
            const rect = mapContainer.getBoundingClientRect();
            const touchCenterX = midX - rect.left;
            const touchCenterY = midY - rect.top;

            // 计算当前在触摸中心点的地图坐标
            const mapPointX = (touchCenterX - offsetX) / scale;
            const mapPointY = (touchCenterY - offsetY) / scale;

            // 计算新的缩放比例
            const distance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            if (touchStartDistance > 0) {
                const newScale = touchStartScale * (distance / touchStartDistance);
                scale = Math.min(Math.max(0.2, newScale), 5);

                // 重新计算 offsetX 和 offsetY，以保持触摸中心点对应的地图坐标不变
                offsetX = touchCenterX - mapPointX * scale;
                offsetY = touchCenterY - mapPointY * scale;

                applyMapTransform();
            }
        }
    });

    mapContainer.addEventListener('touchend', () => { isDragging = false; touchStartDistance = 0; });
    var firstData = true;
    // 定时轮询：带上已渲染数据的版本 token，内容未变化时服务端回 204，
    // 省掉每次数百 KB 的传输与解析；长期无变化时兜底请求一次强制重建。
    var dataToken = null;
    var dataChangedAt = Date.now();

    async function updateGameData(forceUpdate = false) {
        try {
            const authInput = document.getElementById('auth-input'), password = authInput.value.trim();
            const authContainer = document.getElementById('auth-container'), authError = document.getElementById('auth-error');
            if (!password) { authContainer.classList.remove('hidden'); return; }
            const headers = { 'X-Auth-Token': password };
            if (!forceUpdate) {
                if (Date.now() - dataChangedAt > DATA_REFRESH_FALLBACK_MS) headers['X-Data-No-Cache'] = '1';
                else if (dataToken) headers['X-Data-Token'] = dataToken;
            }
            const response = await fetch('/api/data', { headers });
            if (response.status === 401) { authContainer.classList.remove('hidden'); authError.style.display = 'block'; localStorage.removeItem('authToken'); return; }
            if (response.status === 204) return;
            localStorage.setItem('authToken', password);
            authError.style.display = 'none';
            authContainer.classList.add('hidden');
            if (firstData && !forceUpdate) { forceUpdate = true; firstData = false; }
            forceUpdate = true;
            const token = response.headers.get('X-Data-Token');
            const data = await response.json();
            // 收到完整负载即视为已与服务端同步（无论内容是否变化），否则兜底强制重建会每轮重触发。
            dataChangedAt = Date.now();
            if (token !== dataToken) dataToken = token;
            entitiesToRender = [...data.entities];
            itemsToRender = Array.isArray(data.items) ? [...data.items] : [];
            localPlayer = data.local_player;
            teammates = data.teammates;
            if (localPlayer) {
                if (!entitiesToRender.some(e => e.id === localPlayer.id)) {
                    entitiesToRender.push({ ...localPlayer, name: 'Local Player', health: 100, max_health: 100, orientation: localPlayer.yaw });
                }
            }
            if (forceUpdate || data.teammates.length !== teammates.length) updatePlayerButtons();
            if (pendingPlayerSelection !== null) { selectPlayer(pendingPlayerSelection); pendingPlayerSelection = null; }
            if (isFollowing) recenterView();
            map.innerHTML = '';
            entitiesToRender.forEach(entityData => {
                const entityType = entityData.type || 'player';
                if (cleanMode && entityType === 'ai') return;
                const isAi = entityType === 'ai';
                const isDead = entityData.has_health === true && Number(entityData.health) <= 0;
                // 纯净模式只看活人：血量为零的角色整体隐藏（血环、名字武器、尸体都不画）
                if (cleanMode && !isAi && isDead) return;
                const { position: map2DPos, rotation: correctedOrientation } = getTransformedData(entityData, currentMap);
                const container = document.createElement('div');
                container.className = 'entity-container';
                container.dataset.entityId = entityData.id;
                const body = document.createElement('div');
                body.className = 'entity-body';
                const isTeammate = !isAi && entityData.team_id === localPlayer?.team_id;
                const health = Number(entityData.health);
                const maxHealth = Number(entityData.max_health);
                const hasHealth = entityData.has_health !== false && entityData.has_max_health !== false
                    && Number.isFinite(health)
                    && Number.isFinite(maxHealth) && maxHealth > 0;
                if (!isAi && hasHealth && !(cleanMode && health <= 0)) {
                    const healthRing = document.createElement('div');
                    const healthRatio = Math.max(0, Math.min(1, health / maxHealth));
                    healthRing.className = 'entity-health-ring';
                    healthRing.style.setProperty('--health-ratio', healthRatio.toString());
                    healthRing.style.setProperty('--health-color', healthRatio > 0.5 ? '#54d66a' : (healthRatio > 0.25 ? '#f4c542' : '#ef5350'));
                    container.appendChild(healthRing);
                }
                if (isTeammate) {
                    const isSelf = entityData.id === localPlayer?.id;
                    let isSelected = (selectedPlayerId === null || selectedPlayerId === '') ? isSelf : (entityData.id == selectedPlayerId);
                    body.classList.add(isSelected ? 'white-player' : 'teammate');
                } else if (isAi) {
                    body.style.backgroundColor = isDead ? 'transparent' : 'rgba(255, 152, 0, 1)';
                    body.style.borderColor = isDead ? 'rgba(255, 152, 0, 1)' : 'black';
                    if (!isDead) body.textContent = 'A';
                } else {
                    const teamColor = getTeamColor(entityData.team_id);
                    if (isDead) { body.classList.add('dead'); body.style.borderColor = teamColor; }
                    else { body.style.backgroundColor = teamColor; body.style.borderColor = 'black'; body.textContent = entityData.team_id; }
                }
                if (!isDead && entityData.has_orientation !== false) {
                    const direction = document.createElement('div');
                    direction.className = 'entity-direction';
                    direction.style.transform = `translateX(-50%) rotate(${correctedOrientation}deg)`;
                    container.appendChild(direction);
                }
                container.appendChild(body);
                if (!isAi) {
                    const info = document.createElement('div');
                    info.className = 'entity-info';
                    const heroText = entityData.has_hero === false ? '?' : readableCatalogName(entityData.hero_name, '未知探员');
                    const weaponText = entityData.has_weapon === false ? '?' : readableCatalogName(entityData.weapon_name, '未知武器');
                    info.textContent = `${heroText} ${weaponText}`;
                    container.appendChild(info);
                }
                container.style.left = `${map2DPos.x}px`;
                container.style.top = `${map2DPos.y}px`;
                map.appendChild(container);
            });
            refreshResourceMarkers();
            refreshCalibrationEntity();
            renderCalibrationMarkers();
        } catch (error) {
            console.error('获取游戏数据失败:', error);
            document.getElementById('auth-container').classList.remove('hidden');
        }
    }

    function renderRadarItemMarker(itemData) {
        const { position: map2DPos } = getTransformedData(itemData, currentMap);
        const container = document.createElement('div');
        container.className = 'entity-container';
        container.classList.add('resource-marker');
        container.dataset.entityId = itemData.id;
        const itemLabel = itemData.dead_box_name || itemData.item_name || 'item';
        container.title = itemLabel;
        const body = document.createElement('div');
        body.className = 'entity-body item-body';
        body.style.backgroundColor = itemData.item_quality_color || '#ffeb3b';
        body.textContent = itemData.type === 'deadbody' ? 'D' : 'I';
        container.appendChild(body);
        const info = document.createElement('div');
        info.className = 'entity-info item-info';
        info.style.color = itemData.item_quality_color || '#ffeb3b';
        info.textContent = itemData.has_password ? `${itemLabel} 密码 ${itemData.password}` : itemLabel;
        container.appendChild(info);
        container.style.left = `${map2DPos.x}px`;
        container.style.top = `${map2DPos.y}px`;
        map.appendChild(container);
    }

    function refreshResourceMarkers() {
        document.querySelectorAll('.resource-marker').forEach(marker => marker.remove());
        if (!resourcesVisible || cleanMode) return;
        itemsToRender
            .filter(item => selectedItemQualities.has(Number(item.item_quality) || 0))
            .forEach(renderRadarItemMarker);
    }

    function recenterView() {
        let targetPlayer = null;
        if (selectedPlayerId) { targetPlayer = teammates.find(t => t.id == selectedPlayerId) || entitiesToRender.find(e => e.id == selectedPlayerId); }
        if (!targetPlayer) targetPlayer = localPlayer;
        if (targetPlayer) {
            const { position: viewCenter2D } = getTransformedData(targetPlayer, currentMap);
            const rect = mapContainer.getBoundingClientRect();
            offsetX = rect.width / 2 - viewCenter2D.x * scale;
            offsetY = rect.height / 2 - viewCenter2D.y * scale;
            applyMapTransform();
        }
    }
    function loadSelection() { currentMap = localStorage.getItem('selectedMap') || 'db.png'; pendingPlayerSelection = localStorage.getItem('selectedPlayerId'); }
    function loadToggles() { if (localStorage.getItem('cleanMode') === '1') setCleanMode(true, false); }
    function saveSelection() { localStorage.setItem('selectedMap', currentMap); localStorage.setItem('selectedPlayerId', selectedPlayerId || ''); }

    function selectMap(mapId) {
        currentMap = mapId;
        map.style.backgroundImage = `url('/image/${currentMap}')`;
        const dims = mapDimensions[mapId] || { width: 1000, height: 1000 };
        map.style.width = `${dims.width}px`;
        map.style.height = `${dims.height}px`;
        document.querySelectorAll('.map-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.map === mapId));
        checkCalibration(mapId);
        delete transformerCache[mapId];
        if (calibrateMode) { syncCalibrationInputs(); renderCalibrationMarkers(); }
        saveSelection();
        updateGameData(true);
    }

    function selectPlayer(playerId) { selectedPlayerId = playerId; isFollowing = true; document.querySelectorAll('.player-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.playerId == (playerId || ''))); recenterView(); saveSelection(); }
    function setResourceVisibility(visible) {
        resourcesVisible = visible;
        const toggle = document.getElementById('resource-toggle');
        toggle.classList.toggle('active', resourcesVisible);
        toggle.setAttribute('aria-pressed', String(resourcesVisible));
        if (resourcesVisible && !cleanMode) {
            refreshResourceMarkers();
            return;
        }
        document.querySelectorAll('.resource-marker').forEach(marker => marker.remove());
    }
    function toggleResourceVisibility() { if (cleanMode) return; setResourceVisibility(!resourcesVisible); }
    function applyCleanModeUi() {
        const toggle = document.getElementById('clean-toggle');
        toggle.classList.toggle('active', cleanMode);
        toggle.setAttribute('aria-pressed', String(cleanMode));
        document.getElementById('resource-toggle').disabled = cleanMode;
        document.getElementById('quality-filter').classList.toggle('disabled', cleanMode);
    }
    // 纯净模式: 只保留玩家(自己/队友/敌人)，隐藏物资与人机
    function setCleanMode(enabled, rerender = true) {
        cleanMode = enabled;
        if (cleanMode) {
            resourcesVisibleBeforeClean = resourcesVisible;
            setResourceVisibility(false);
        } else {
            setResourceVisibility(resourcesVisibleBeforeClean);
        }
        applyCleanModeUi();
        localStorage.setItem('cleanMode', cleanMode ? '1' : '0');
        if (rerender) updateGameData(true);
    }
    function toggleCleanMode() { setCleanMode(!cleanMode); }
    // ===============================================================
    // == 校准模式：点地图取点，实时改当前地图的 point2D/point3D ==
    // == 面板里的代码块可直接粘回 mapConverters；改动不落盘，刷新回到文件值。 ==
    // ===============================================================
    let calibrateMode = false, calibrateSlot = 1, pressX = 0, pressY = 0, lastTouchPickAt = 0, lastTouchCount = 0;
    // 校准模式下点中的实体（角色/物资）；本地玩家链条不可信时用它取世界坐标
    let calibrateEntity = null;
    // 每张图进入校准模式时的快照，供「还原」退回页面加载时（文件里）的值
    const calibrationBackups = {};
    const CALIBRATE_INPUT_IDS = ['cal-w1x', 'cal-w1y', 'cal-m1x', 'cal-m1y', 'cal-w2x', 'cal-w2y', 'cal-m2x', 'cal-m2y'];

    // 当前地图没有校准条目时（如 jy.png）按需补一个全零点位，方便从零标起。
    function calibrationTarget(createIfMissing) {
        let converter = mapConverters[currentMap];
        if (!converter && createIfMissing) {
            converter = mapConverters[currentMap] = {
                point3D_1: { x: 0, y: 0 }, point2D_1: { x: 0, y: 0 },
                point3D_2: { x: 0, y: 0 }, point2D_2: { x: 0, y: 0 },
            };
            delete transformerCache[currentMap];
        }
        return converter;
    }

    function calibrationValue(point, axis) { return Number(point && point[axis]) || 0; }

    function calibrationCodeSnippet() {
        const converter = calibrationTarget(false) || {};
        const point = p => `{ x: ${calibrationValue(p, 'x')}, y: ${calibrationValue(p, 'y')} }`;
        return `        "${currentMap}": {\n`
            + `            point3D_1: ${point(converter.point3D_1)},\n`
            + `            point2D_1: ${point(converter.point2D_1)},\n`
            + `            point3D_2: ${point(converter.point3D_2)},\n`
            + `            point2D_2: ${point(converter.point2D_2)}\n`
            + `        },`;
    }

    function syncCalibrationInputs() {
        const converter = calibrationTarget(false);
        [1, 2].forEach(n => {
            const world = (converter && converter['point3D_' + n]) || {};
            const mapPoint = (converter && converter['point2D_' + n]) || {};
            const set = (id, value) => { const el = document.getElementById(id); if (el) el.value = value; };
            set(`cal-w${n}x`, calibrationValue(world, 'x'));
            set(`cal-w${n}y`, calibrationValue(world, 'y'));
            set(`cal-m${n}x`, calibrationValue(mapPoint, 'x'));
            set(`cal-m${n}y`, calibrationValue(mapPoint, 'y'));
        });
        const box = document.getElementById('cal-code');
        if (box) box.value = calibrationCodeSnippet();
    }

    // 输入框 -> mapConverters -> 清换算缓存 -> 重绘（不发请求，等下一次轮询带出新位置）
    function applyCalibrationInputs() {
        const converter = calibrationTarget(true);
        CALIBRATE_INPUT_IDS.forEach(id => {
            const el = document.getElementById(id);
            const match = el && /^cal-([wm])([12])([xy])$/.exec(id);
            if (!match) return;
            const key = (match[1] === 'w' ? 'point3D_' : 'point2D_') + match[2];
            if (!converter[key]) converter[key] = { x: 0, y: 0 };
            converter[key][match[3]] = parseFloat(el.value) || 0;
        });
        delete transformerCache[currentMap];
        const box = document.getElementById('cal-code');
        if (box) box.value = calibrationCodeSnippet();
        checkCalibration(currentMap);
        renderCalibrationMarkers();
    }

    // 两个校准点在底图上的位置（1 红 2 蓝），随 #map 一起平移缩放
    function renderCalibrationMarkers() {
        document.querySelectorAll('.calibrate-marker').forEach(el => el.remove());
        highlightCalibrationEntity();
        if (!calibrateMode) return;
        const converter = calibrationTarget(false);
        if (!converter) return;
        [[1, '#ff5252'], [2, '#40c4ff']].forEach(([n, color]) => {
            const point = converter['point2D_' + n];
            if (!point) return;
            const marker = document.createElement('div');
            marker.className = 'calibrate-marker';
            marker.textContent = String(n);
            marker.style.borderColor = color;
            marker.style.left = `${calibrationValue(point, 'x')}px`;
            marker.style.top = `${calibrationValue(point, 'y')}px`;
            map.appendChild(marker);
        });
    }

    function armCalibrateSlot(n) {
        calibrateSlot = Number(n) === 2 ? 2 : 1;
        [1, 2].forEach(i => {
            const button = document.getElementById(`cal-pick-${i}`);
            if (button) button.classList.toggle('active', calibrateSlot === i);
        });
        const hint = document.getElementById('cal-hint');
        if (hint) hint.textContent = `点地图取点${calibrateSlot}的图上坐标（拖拽/缩放不取点）`;
    }

    function setCalibrateMode(enabled) {
        calibrateMode = !!enabled;
        if (calibrateMode && !calibrationBackups[currentMap]) {
            calibrationBackups[currentMap] = JSON.parse(JSON.stringify(calibrationTarget(true)));
        }
        const panel = document.getElementById('calibrate-panel');
        if (panel) panel.classList.toggle('open', calibrateMode);
        const toggle = document.getElementById('calibrate-toggle');
        if (toggle) { toggle.classList.toggle('active', calibrateMode); toggle.setAttribute('aria-pressed', String(calibrateMode)); }
        if (calibrateMode) { syncCalibrationInputs(); armCalibrateSlot(1); }
        syncCalibrationEntityLine();
        renderCalibrationMarkers();
    }

    // 屏幕坐标 -> 地图像素坐标（与滚轮/双指缩放共用 offset 与 scale）
    function screenToMapPoint(clientX, clientY) {
        const rect = mapContainer.getBoundingClientRect();
        return { x: (clientX - rect.left - offsetX) / scale, y: (clientY - rect.top - offsetY) / scale };
    }

    function pickCalibrationPoint(clientX, clientY) {
        if (!calibrateMode) return false;
        if (Math.hypot(clientX - pressX, clientY - pressY) > 8) return false; // 拖拽经过，不算取点
        const point = screenToMapPoint(clientX, clientY);
        const converter = calibrationTarget(true);
        converter['point2D_' + calibrateSlot] = { x: Number(point.x.toFixed(2)), y: Number(point.y.toFixed(2)) };
        delete transformerCache[currentMap];
        syncCalibrationInputs();
        checkCalibration(currentMap);
        renderCalibrationMarkers();
        return true;
    }

    // 站在地标上时用：把雷达里的自己位置填成该点的世界坐标
    function useCurrentPositionForPoint(n) {
        const position = localPlayer && localPlayer.position;
        if (!position || !Number.isFinite(Number(position.x)) || !Number.isFinite(Number(position.y))) return false;
        const converter = calibrationTarget(true);
        converter[Number(n) === 2 ? 'point3D_2' : 'point3D_1'] = {
            x: Number(Number(position.x).toFixed(1)), y: Number(Number(position.y).toFixed(1)),
        };
        delete transformerCache[currentMap];
        syncCalibrationInputs();
        checkCalibration(currentMap);
        renderCalibrationMarkers();
        return true;
    }

    // ---- 选中实体：校准模式下点地图上的角色/物资，用它的世界坐标当校准点 ----
    // 实体坐标是雷达画点一直在用的那份数据；本地玩家链条不可信时改用它。
    function calibrationEntityLabel(entity) {
        if (entity.type === 'item' || entity.type === 'deadbody') {
            return entity.dead_box_name || entity.item_name || '物资';
        }
        if (localPlayer && entity.id === localPlayer.id) return '自己';
        if (entity.type === 'ai') return '人机';
        if (localPlayer && entity.team_id === localPlayer.team_id) return '队友';
        const hero = readableCatalogName(entity.hero_name, '');
        return `玩家(队${entity.team_id})${hero ? ' ' + hero : ''}`;
    }

    function findCalibrationEntity(entityId) {
        return entitiesToRender.find(e => e.id === entityId) || itemsToRender.find(i => i.id === entityId) || null;
    }

    function syncCalibrationEntityLine() {
        const line = document.getElementById('cal-entity');
        if (!line) return;
        if (!calibrateEntity) { line.textContent = '无 — 校准模式下点地图上的角色/物资即可选中'; return; }
        const position = calibrateEntity.position;
        line.textContent = position
            ? `${calibrateEntity.label} (${Math.round(position.x)}, ${Math.round(position.y)})`
            : `${calibrateEntity.label} — 已不在数据里`;
    }

    function selectCalibrationEntity(entityId) {
        if (!calibrateMode || !entityId) return false;
        const found = findCalibrationEntity(entityId);
        if (!found) return false;
        calibrateEntity = {
            id: entityId,
            label: calibrationEntityLabel(found),
            position: found.position ? { x: Number(found.position.x) || 0, y: Number(found.position.y) || 0 } : null,
        };
        syncCalibrationEntityLine();
        renderCalibrationMarkers();
        return true;
    }

    // 每次数据刷新后更新选中实体的位置；实体暂时消失时保留选中但标记无效。
    function refreshCalibrationEntity() {
        if (!calibrateEntity) return;
        const found = findCalibrationEntity(calibrateEntity.id);
        if (found) calibrateEntity.label = calibrationEntityLabel(found);
        calibrateEntity.position = (found && found.position)
            ? { x: Number(found.position.x) || 0, y: Number(found.position.y) || 0 }
            : null;
        syncCalibrationEntityLine();
    }

    function useSelectedEntityForPoint(n) {
        if (!calibrateEntity || !calibrateEntity.position) return false;
        const converter = calibrationTarget(true);
        converter[Number(n) === 2 ? 'point3D_2' : 'point3D_1'] = {
            x: Number(calibrateEntity.position.x.toFixed(1)),
            y: Number(calibrateEntity.position.y.toFixed(1)),
        };
        delete transformerCache[currentMap];
        syncCalibrationInputs();
        checkCalibration(currentMap);
        renderCalibrationMarkers();
        return true;
    }

    // 点击/触摸落在实体标记上时取它的 id（沿 DOM 往上找 data-entity-id）
    function calibrationEntityFromTarget(target) {
        let node = target;
        while (node && node !== mapContainer && node !== map) {
            if (node.dataset && node.dataset.entityId) return node.dataset.entityId;
            node = node.parentNode;
        }
        return null;
    }

    // 选中的实体画一圈高亮；#map 每次刷新会重建标记，所以重绘时一并刷一遍
    function highlightCalibrationEntity() {
        if (!map || !map.children) return;
        Array.prototype.forEach.call(map.children, el => {
            if (!el || !el.classList) return;
            const isTarget = calibrateMode && !!calibrateEntity && el.dataset && el.dataset.entityId === calibrateEntity.id;
            el.classList.toggle('calibrate-entity', isTarget);
        });
    }

    function revertCalibration() {
        const backup = calibrationBackups[currentMap];
        if (!backup) return false;
        mapConverters[currentMap] = JSON.parse(JSON.stringify(backup));
        delete transformerCache[currentMap];
        syncCalibrationInputs();
        checkCalibration(currentMap);
        renderCalibrationMarkers();
        return true;
    }

    function copyCalibrationCode() {
        const box = document.getElementById('cal-code');
        const text = calibrationCodeSnippet();
        if (box) { box.value = text; if (box.focus) box.focus(); if (box.select) box.select(); }
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => {});
        }
        const hint = document.getElementById('cal-hint');
        if (hint) hint.textContent = '已生成代码，粘回 webpage.html 的 mapConverters';
    }

    function bindCalibrateUi() {
        const toggle = document.getElementById('calibrate-toggle');
        if (toggle) toggle.onclick = () => setCalibrateMode(!calibrateMode);
        const close = document.getElementById('cal-close');
        if (close) close.onclick = () => setCalibrateMode(false);
        [1, 2].forEach(n => {
            const pick = document.getElementById(`cal-pick-${n}`);
            if (pick) pick.onclick = () => armCalibrateSlot(n);
            const here = document.getElementById(`cal-here-${n}`);
            if (here) here.onclick = () => useCurrentPositionForPoint(n);
            const ent = document.getElementById(`cal-ent-${n}`);
            if (ent) ent.onclick = () => useSelectedEntityForPoint(n);
        });
        const copy = document.getElementById('cal-copy');
        if (copy) copy.onclick = copyCalibrationCode;
        const revert = document.getElementById('cal-revert');
        if (revert) revert.onclick = revertCalibration;
        CALIBRATE_INPUT_IDS.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.oninput = applyCalibrationInputs;
        });
    }

    mapContainer.addEventListener('mousedown', (e) => { pressX = e.clientX; pressY = e.clientY; });
    mapContainer.addEventListener('touchstart', (e) => {
        lastTouchCount = (e.touches && e.touches.length) || 0;
        if (lastTouchCount === 1) { pressX = e.touches[0].clientX; pressY = e.touches[0].clientY; }
    });
    // 落在实体标记上的点按算「选中该实体」，其它位置才算取校准点
    mapContainer.addEventListener('click', (e) => {
        if (Date.now() - lastTouchPickAt <= 600) return;
        if (selectCalibrationEntity(calibrationEntityFromTarget(e.target))) return;
        pickCalibrationPoint(e.clientX, e.clientY);
    });
    // 触摸端 touchstart 已 preventDefault，合成 click 不一定来，这里补一条取点路径。
    // 双指缩放走过的 touchstart 记下的 lastTouchCount > 1，抬指时不取点。
    mapContainer.addEventListener('touchend', (e) => {
        const wasPinch = lastTouchCount > 1;
        if (!e.touches || e.touches.length === 0) lastTouchCount = 0;
        if (wasPinch || !calibrateMode || !e.changedTouches || e.changedTouches.length !== 1) return;
        lastTouchPickAt = Date.now();
        if (selectCalibrationEntity(calibrationEntityFromTarget(e.target))) return;
        pickCalibrationPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    });

    function updateMapButtons() { const container = document.getElementById('map-buttons'); container.innerHTML = ''; Object.keys(mapDimensions).forEach(id => { const button = document.createElement('button'); button.className = `map-btn ${currentMap === id ? 'active' : ''}`; button.textContent = id.split('.')[0].toUpperCase(); button.dataset.map = id; button.onclick = () => selectMap(id); container.appendChild(button); }); }
    function updatePlayerButtons() { const container = document.getElementById('player-buttons'); container.innerHTML = ''; const selfButton = document.createElement('button'); selfButton.className = `player-btn ${!selectedPlayerId || selectedPlayerId === '' ? 'active' : ''}`; selfButton.textContent = '自己'; selfButton.dataset.playerId = ''; selfButton.onclick = () => selectPlayer(null); container.appendChild(selfButton); var teamIndex = 1; teammates.forEach(t => { if (localPlayer && t.id === localPlayer.id) return; const button = document.createElement('button'); button.className = `player-btn ${selectedPlayerId == t.id ? 'active' : ''}`; button.textContent = `队友${ teamIndex}`; teamIndex++; button.dataset.playerId = t.id; button.onclick = () => selectPlayer(t.id); container.appendChild(button); }); }
    function loadAuth() { const savedPassword = localStorage.getItem('authToken'); if (savedPassword) { document.getElementById('auth-input').value = savedPassword; } }

    loadSelection();
    loadAuth();
    loadToggles();
    updateMapButtons();
    bindCalibrateUi();
    selectMap(currentMap);
    updateGameData(true);
    // 目标 60Hz：一轮结束（含等待响应）后再等 16ms 发起下一轮，
    // 网络慢时自动降速而不是堆积请求。
    function scheduleGameDataPoll() {
        setTimeout(async () => {
            await updateGameData();
            scheduleGameDataPoll();
        }, DATA_POLL_INTERVAL_MS);
    }
    scheduleGameDataPoll();
    document.getElementById('auth-submit').addEventListener('click', () => {
        updateGameData(true);
    });
    document.getElementById('auth-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            updateGameData(true);
        }
    });
    document.getElementById('resource-toggle').addEventListener('click', toggleResourceVisibility);
    document.getElementById('clean-toggle').addEventListener('click', toggleCleanMode);
    document.querySelectorAll('#quality-filter input[data-quality]').forEach(input => {
        input.addEventListener('change', () => {
            const quality = Number(input.dataset.quality);
            if (input.checked) selectedItemQualities.add(quality);
            else selectedItemQualities.delete(quality);
            refreshResourceMarkers();
        });
    });
    </script>
</body>
</html>
